services:
  - type: web
    name: booknest-library
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booknest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: https://booknest-library.onrender.com

databases:
  - name: booknest-db
    plan: free
    databaseName: booknest
    user: booknest
